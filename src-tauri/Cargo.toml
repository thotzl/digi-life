[package]
name = "src-tauri"
version = "0.1.0"
edition = "2024"
default-run = "src-tauri"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rusqlite = { version = "0.29", features = ["bundled"] }
tauri = { version = "2.0", features = [] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
