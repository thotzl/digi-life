[package]
name = "src-tauri"
version = "1.12.21"
edition = "2024"
default-run = "src-tauri"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rusqlite = { version = "0.29", features = ["bundled"] }
tauri = { version = "2.0", features = [] }
ts-rs = { version = "10.0" }
rayon = "1"
libm = "0.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
