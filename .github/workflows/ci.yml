name: "CI"

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm ci

      # Builds dist/ (required by tauri::generate_context!) and type-checks the frontend
      - name: build frontend
        run: npm run build

      - name: frontend unit tests
        run: npm test

      # Also regenerates the ts-rs bindings in bindings/
      - name: rust tests
        run: cargo test

      - name: bindings drift check
        run: git diff --exit-code -- bindings/

      # Fixed-seed headless trainer run compared against the committed reference (TCK-186)
      - name: trainer reference run
        run: |
          cargo run --release --features runner --bin trainer_runner -- run --seed ci-reference --generations 3 --scenario standard --population 16 --parallel true --out target/trainer-ci.json
          node tests/reference/compare-trainer-report.mjs tests/reference/trainer-ci.json target/trainer-ci.json

      # Curriculum room with a low gate threshold so the gate moves, plus the final evaluation in both fixed rooms (TCK-197)
      - name: trainer curriculum reference run
        run: |
          cargo run --release --features runner --bin trainer_runner -- run --seed ci-curriculum --generations 4 --scenario curriculum --population 16 --rehearsal 0 --curriculum-upper 0.05 --curriculum-lower 0.02 --eval-final standard,exploration --eval-trials 3 --parallel true --out target/trainer-ci-curriculum.json
          node tests/reference/compare-trainer-report.mjs tests/reference/trainer-ci-curriculum.json target/trainer-ci-curriculum.json

      # Rehearsal trials in the curriculum (share 0.25), not covered by the other references (TCK-197)
      - name: trainer rehearsal reference run
        run: |
          cargo run --release --features runner --bin trainer_runner -- run --seed ci-rehearsal --generations 4 --scenario curriculum --population 16 --rehearsal 0.25 --curriculum-upper 0.05 --curriculum-lower 0.02 --parallel true --out target/trainer-ci-rehearsal.json
          node tests/reference/compare-trainer-report.mjs tests/reference/trainer-ci-rehearsal.json target/trainer-ci-rehearsal.json

      # Fixed-seed headless Ocean run (fresh start, no DB; the seed has mitosis, bites and all death causes) against the committed reference (TCK-158)
      - name: ocean reference run
        run: |
          cargo run --release --features runner --bin trainer_runner -- ocean --seed ci-ocean-2 --ticks 12000 --sample-every 500 --out target/ocean-ci.json
          node tests/reference/compare-trainer-report.mjs tests/reference/ocean-ci.json target/ocean-ci.json

      # Wikilinks, `sources:` and doc paths in the wiki, skills and open/ongoing tickets must resolve (TCK-197)
      - name: doc link check
        run: node scripts/check-links.mjs
